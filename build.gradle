plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Resources produced by the data generators (models, blockstates, recipes, loot, tags, lang).
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    // The data generators' cache (patterns are relative to each resource folder).
    exclude("**/.cache", "**/.cache/**")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroup 'com.geckolib' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared (JEI)'
                url = 'https://maven.blamejared.com/'
            }
        }
        filter {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
}

base {
    // The Minecraft version in the name, so this branch's jar is never taken for main's.
    archivesName = "${mod_id}-mc${minecraft_version}"
}

// The licence travels in the jar (MIT asks for its notice in every copy; it also points to the sound credits).
tasks.named('jar', Jar) {
    def licenceName = "LICENSE_${project.property('mod_id')}"
    from('LICENSE') {
        rename { licenceName }
    }
}

// Mojang ships Java 25 to end users in 26.3, so the mod targets Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// The photographers' and benches' window, width x height: -PshotSize=1920x1080 for the mod page's gallery pictures.
def shotSize = (project.findProperty('shotSize') ?: '1280x720').toString().split('x')

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Makes a flat creative world, opens the Field Manual on a set of pages, screenshots each into
        // run/screenshots/manual_<n>.png and quits (see ManualPhotographer).
        manualShots {
            client()
            systemProperty 'groundburst.manualShots', 'true'
            // -PmanualEntry=ordnance/assembly shoots just that entry's spreads (the first eight); -PmanualEntry=home the contents.
            systemProperty 'groundburst.manualShots.entry', (project.findProperty('manualEntry') ?: '').toString()
        }

        // Makes a flat world, sets off each test blast profile in turn and screenshots the effects at set moments into
        // run/screenshots/fx_<profile>_<tick>.png, then quits (see FxPhotographer). -PfxOnly=large shoots just one
        // (scenes whose names start with it); -PfxOnly=a,b several.
        fxShots {
            client()
            systemProperty 'groundburst.fxShots', 'true'
            programArguments.addAll '--width', shotSize[0], '--height', shotSize[1]
            systemProperty 'groundburst.fxShots.only', (project.findProperty('fxOnly') ?: '').toString()
            // -PfxWorld=real: a normally generated world (seed -PfxSeed), each scene on land found for it, the way the mod
            // page's pictures are taken (real worlds only).
            systemProperty 'groundburst.fxShots.world', (project.findProperty('fxWorld') ?: '').toString()
            if (project.findProperty('fxSeed') != null) {
                systemProperty 'groundburst.fxShots.seed', project.findProperty('fxSeed').toString()
            }
        }

        // Makes a normal world, generates the ground round its spawn, sets a blast off there with the player watching
        // from 360 blocks east, records every server tick until it has finished and writes run/bench/<profile>_<time>.csv
        // and .txt, then quits (see BlastBench). -Pbench=<profile> (default the Tsar); -PbenchSeed=<seed>.
        blastBench {
            client()
            programArguments.addAll '--width', shotSize[0], '--height', shotSize[1]
            systemProperty 'groundburst.blastBench', (project.findProperty('bench') ?: 'tsar_warhead').toString()
            // -PbenchHeal=true: healing on, and the record runs on through the crater's healing.
            systemProperty 'groundburst.blastBench.heal', (project.findProperty('benchHeal') ?: 'false').toString()
            if (project.findProperty('benchSeed') != null) {
                systemProperty 'groundburst.blastBench.seed', project.findProperty('benchSeed').toString()
            }
            // For the mod page's pictures: -PbenchMoments=0,40,... when to take them, -PbenchRender=<chunks> how far the
            // player sees (12), -PbenchClean=true no hand, hotbar or tutorial pop-ups.
            ['benchMoments': 'moments', 'benchRender': 'render', 'benchClean': 'clean'].each { prop, key ->
                if (project.findProperty(prop) != null) {
                    systemProperty "groundburst.blastBench.${key}", project.findProperty(prop).toString()
                }
            }
        }

        // Makes a normal world and checks the old sites and the wasteland on it: a census of every site within 10 km of
        // the spawn (and vanilla's for comparison), visits with pictures, two nuclear blasts (one with nobody near);
        // writes run/survey/ and run/screenshots/survey_*.png, then quits (see WorldSurvey).
        // -Psurvey=census,visits,blast (default all); -PsurveySeed=<seed>.
        worldSurvey {
            client()
            programArguments.addAll '--width', shotSize[0], '--height', shotSize[1]
            systemProperty 'groundburst.worldSurvey', (project.findProperty('survey') ?: 'all').toString()
            if (project.findProperty('surveySeed') != null) {
                systemProperty 'groundburst.worldSurvey.seed', project.findProperty('surveySeed').toString()
            }
        }

        // Places each world site on flat grass as generation would, photographs it at noon from its corners, the ground
        // and above into run/screenshots/site_<name>_<variant>_<view>.png, then quits (see SitePhotographer).
        // -Psite=radar_outpost,test_site (default all); -PsiteVariant=<n> (default 0).
        siteShots {
            client()
            programArguments.addAll '--width', shotSize[0], '--height', shotSize[1]
            systemProperty 'groundburst.siteShots', (project.findProperty('site') ?: 'all').toString()
            systemProperty 'groundburst.siteShots.variant', (project.findProperty('siteVariant') ?: '0').toString()
        }

        // Makes a flat creative world, "Ground Burst Showroom" (run/saves/ground_burst_showroom), lays out the four sets of
        // cosmetic blocks along a path with signs, photographs it into run/screenshots/showroom_*.png and quits, the world
        // saved to copy into an instance's saves (see Showroom).
        showroom {
            client()
            programArguments.addAll '--width', shotSize[0], '--height', shotSize[1]
            systemProperty 'groundburst.showroom', 'true'
            // -PshowroomWalk: a timed walk round the bunker doors instead of the pictures (run/bench/showroom_walk_*.txt).
            systemProperty 'groundburst.showroom.walk', (project.findProperty('showroomWalk') ?: 'false').toString()
        }

        // Makes a flat world, turns healing on with short waits, builds a farmstead and a little town, blows them up (a
        // thermobaric warhead, a tactical nuke), photographs them before, after, healing and healed into
        // run/screenshots/heal_<scene>_<stage>.png, compares every block with what it was (run/heal/heal_check.txt), then
        // quits (see HealPhotographer).
        healShots {
            client()
            programArguments.addAll '--width', shotSize[0], '--height', shotSize[1]
            systemProperty 'groundburst.healShots', 'true'
            // -PhealWorld=real: a normally generated world (seed -PhealSeed), the nearest village nuked and healed, for the
            // mod page's pictures (real worlds only).
            systemProperty 'groundburst.healShots.world', (project.findProperty('healWorld') ?: '').toString()
            if (project.findProperty('healSeed') != null) {
                systemProperty 'groundburst.healShots.seed', project.findProperty('healSeed').toString()
            }
        }

        // Makes a normal world seen far (-PplayView=32, -PplaySim=12), finds a forest and plays a script there: a quiet
        // spell, molotovs and a thermobaric warhead among the trees, the fires, the healing (-PplayHeal=false: none), a
        // quiet spell after; times every server tick and frame by phase into run/bench/play_*.txt, then quits (see
        // PlayBench). With -Pjfr=<name> (any run) the JVM records a flight recording into run/jfr/<name>.jfr.
        playBench {
            client()
            programArguments.addAll '--width', shotSize[0], '--height', shotSize[1]
            systemProperty 'groundburst.playBench', 'true'
            systemProperty 'groundburst.playBench.heal', (project.findProperty('playHeal') ?: 'true').toString()
            systemProperty 'groundburst.playBench.view', (project.findProperty('playView') ?: '32').toString()
            systemProperty 'groundburst.playBench.sim', (project.findProperty('playSim') ?: '12').toString()
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Launches a GameTestServer, runs every registered gametest for this mod, then exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            if (project.findProperty('jfr') != null) {
                def jfrDir = file('run/jfr')
                jfrDir.mkdirs()
                jvmArguments.add("-XX:StartFlightRecording=filename=${new File(jfrDir, project.findProperty('jfr').toString() + '.jfr').absolutePath},settings=profile,dumponexit=true".toString())
            }
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Runtime-only dependencies for dev testing that must not leak into the published metadata.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Animated models (missiles, launchers, silo doors, radar dishes, guns, machines). The one hard dependency.
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // JEI integration (optional at runtime): compile against the API, run the full mod in the dev client.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            geckolib_version       : geckolib_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Every error at once while porting (javac stops at 100).
    options.compilerArgs += ['-Xmaxerrs', '5000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---------------------------------------------------------------------------------------------
// Deployment: every `build` ends with the fresh jar in a CurseForge test instance, the folder
// `deploy_instance_dir_26_1_2` names (set in your own ~/.gradle/gradle.properties; a 26.1.2 instance, not main's
// `deploy_instance_dir`); without one the jar just stays in build/libs.
// ---------------------------------------------------------------------------------------------

abstract class DeployToInstance extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getJarFile()

    @Internal
    abstract DirectoryProperty getModsDir()

    @Input
    abstract Property<String> getModId()

    /** Whether an instance folder was named outright (deploy_instance_dir_26_1_2): then a missing one is an error. */
    @Input
    abstract Property<Boolean> getRequired()

    /** Required mods (e.g. GeckoLib) to install if the instance has no copy of them yet. */
    @InputFiles
    abstract ConfigurableFileCollection getDependencyJars()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void deploy() {
        File dir = modsDir.isPresent() ? modsDir.get().asFile : null
        if (dir == null || !dir.parentFile.isDirectory()) {
            String where = dir == null ? "(no default folder on this system)" : "${dir.parentFile}"
            if (required.get()) {
                throw new GradleException("CurseForge instance not found at ${where}. " +
                        "Set deploy_instance_dir_26_1_2 in gradle.properties or pass -Pdeploy_instance_dir_26_1_2=<path>.")
            }
            // Anyone else building the mod has no test instance: the jar stays in build/libs.
            logger.lifecycle("No CurseForge instance at ${where}: the jar was not deployed (set deploy_instance_dir_26_1_2 to deploy it).")
            return
        }
        dir.mkdirs()

        // Remove every previous build of this mod (any version) so only one copy is ever loaded.
        String prefix = modId.get() + '-'
        dir.listFiles()
                .findAll { it.isFile() && it.name.startsWith(prefix) && it.name.endsWith('.jar') }
                .each { old ->
                    if (!old.delete()) {
                        throw new GradleException("Could not delete ${old} - is Minecraft still running from that instance?")
                    }
                    logger.lifecycle("Removed old jar ${old.name}")
                }

        File jar = jarFile.get().asFile
        fs.copy {
            from jar
            into dir
        }
        logger.lifecycle("Deployed ${jar.name} -> ${dir}")

        // Required dependencies: install only when the instance has none, so a copy installed through the
        // CurseForge app (any version) is never duplicated or replaced.
        dependencyJars.files.each { dep ->
            String key = dep.name.toLowerCase(Locale.ROOT).split('-')[0]
            File existing = dir.listFiles().find { it.isFile() && it.name.toLowerCase(Locale.ROOT).startsWith(key) && it.name.endsWith('.jar') }
            if (existing != null) {
                logger.lifecycle("Dependency ${key} already present (${existing.name})")
            } else {
                fs.copy {
                    from dep
                    into dir
                }
                logger.lifecycle("Installed dependency ${dep.name} -> ${dir}")
            }
        }
    }
}

configurations {
    deployDependencies {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    deployDependencies "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
}

var instanceDir = providers.gradleProperty('deploy_instance_dir_26_1_2')
        .filter { !it.isBlank() }

var deployToInstance = tasks.register('deployToInstance', DeployToInstance) {
    group = 'deployment'
    description = 'Copies the built mod jar into the 26.1.2 CurseForge test instance (deploy_instance_dir_26_1_2), replacing older builds.'
    jarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    modsDir = layout.dir(instanceDir.map { new File(it, 'mods') })
    modId = project.mod_id
    required = providers.gradleProperty('deploy_instance_dir_26_1_2').map { !it.isBlank() }.orElse(false)
    dependencyJars.from(configurations.deployDependencies)
    outputs.upToDateWhen { false }
}

tasks.named('build') {
    finalizedBy deployToInstance
}
