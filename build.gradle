plugins {
    id 'java-library'
    // Forge for 1.20.1 through ModDevGradle's plugin for the older Forge versions (official names in the sources,
    // the jar turned back to Forge's SRG names for players: reobfJar).
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // The data, ported with the rest from the 1.21.1 build (models, blockstates, recipes, loot, tags, lang).
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("**/.cache", "**/.cache/**")
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter {
            includeGroup 'software.bernie.geckolib'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared (JEI)'
                url = 'https://maven.blamejared.com/'
            }
        }
        filter {
            includeGroup 'mezz.jei'
        }
    }
    // Create (optional): its own maven has its slim jar and its parts (Flywheel, Ponder); Registrate is tterrag's.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Create'
                url = 'https://maven.createmod.net'
            }
        }
        filter {
            includeGroup 'com.simibubi.create'
            includeGroup 'dev.engine-room.flywheel'
            includeGroup 'net.createmod.ponder'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'tterrag (Registrate)'
                url = 'https://maven.tterrag.com/'
            }
        }
        filter {
            includeGroup 'com.tterrag.registrate'
        }
    }
    // The optional mods the dev runs load (Oculus, Embeddium, Distant Horizons, Create and its parts) and the test
    // shader packs, from Modrinth by version id.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

base {
    // The Minecraft version in the name, so this jar is never taken for another version's.
    archivesName = "${mod_id}-mc${minecraft_version}"
}

// The licence travels in the jar (MIT asks for its notice in every copy; it also points to the sound credits).
tasks.named('jar', Jar) {
    def licenceName = "LICENSE_${project.property('mod_id')}"
    from('LICENSE') {
        rename { licenceName }
    }
    // Forge 1.20.1 finds a mod's mixins through the jar's manifest.
    manifest.attributes([
            'MixinConfigs': "${mod_id}.legacy.mixins.json,${mod_id}.mixins.json,${mod_id}.port.mixins.json"
    ])
}

// Minecraft 1.20.1 runs on Java 17, so this branch targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    runs {
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // This branch's check that the mod draws on 1.20.1 (as the 1.21.1 build's): makes a flat creative world, sets
        // the mod's blocks out, opens the Field Manual and sets a blast off, screenshotting each into
        // run/screenshots/port_*.png, then quits (dev.groundburst.port.PortCheck).
        portCheck {
            client()
            programArguments.addAll '--width', '1280', '--height', '720'
            systemProperty 'groundburst.portCheck', 'true'
            systemProperty 'groundburst.keepMouse', 'true'
        }

        // Main's play bench (dev.groundburst.blast.PlayBench, the 1.21.1 build's client half): a normal world seen far
        // (-PplayView=32, -PplaySim=12), a forest, molotovs and a thermobaric warhead among the trees, the fires, the
        // healing (-PplayHeal=false: none); every server tick and frame timed by phase into run/bench/play_*.txt, then it
        // quits. With -Pjfr=<name> (any run) the JVM records a flight recording into run/jfr/<name>.jfr.
        playBench {
            client()
            programArguments.addAll '--width', '1280', '--height', '720'
            systemProperty 'groundburst.playBench', 'true'
            systemProperty 'groundburst.keepMouse', 'true'
            systemProperty 'groundburst.playBench.heal', (project.findProperty('playHeal') ?: 'true').toString()
            systemProperty 'groundburst.playBench.view', (project.findProperty('playView') ?: '32').toString()
            systemProperty 'groundburst.playBench.sim', (project.findProperty('playSim') ?: '12').toString()
        }

        // The 1.21.1 build's check that the mod's sites come out of this version's world generation: a normal world, the
        // nearest of each site found, made, measured (its blocks; the rock round its parts underground and the density the
        // ground was shaped with there, to set beside the 1.21.1 build's) and photographed into run/screenshots/sites_*.png,
        // then it quits (dev.groundburst.port.SiteCheck; the log's "Site check:" lines).
        siteCheck {
            client()
            programArguments.addAll '--width', '1280', '--height', '720'
            systemProperty 'groundburst.siteCheck', 'true'
            systemProperty 'groundburst.keepMouse', 'true'
        }

        // Machines and launchers on Create's contraptions (with -PwithCreate: Create loaded), the 1.21.1 build's check less its
        // ships' scenes (Create Aeronautics has no 1.20.1 build): pictures in run/screenshots/create_*.png, the log's
        // "Create check: ... OK" lines (dev.groundburst.compat.CreateCheck).
        createCheck {
            client()
            programArguments.addAll '--width', '1280', '--height', '720'
            systemProperty 'groundburst.createCheck', 'true'
            systemProperty 'groundburst.keepMouse', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // Launches a GameTestServer, runs every registered gametest for this mod, then exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            // -PonlyTests=<name>,<name>: only those of main's tests (GameTestRegistration).
            systemProperty 'groundburst.onlyTests', (project.findProperty('onlyTests') ?: '').toString()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'mixin.env.remapRefMap', 'true'
            if (project.findProperty('packFx') != null) {   // -PpackFx=over|in: drawn after the level, or by the pack's programs
                systemProperty 'groundburst.packFx', project.findProperty('packFx').toString()
            }
            if (project.findProperty('jfr') != null) {
                def jfrDir = file('run/jfr')
                jfrDir.mkdirs()
                jvmArguments.add("-XX:StartFlightRecording=filename=${new File(jfrDir, project.findProperty('jfr').toString() + '.jfr').absolutePath},settings=profile,dumponexit=true".toString())
            }
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// The test runs leave the person at the computer their mouse (the user's wish): the game's window opens behind theirs
// without the focus and never grabs the mouse (dev.groundburst.legacy.client.DevRuns; the runs turn the camera
// themselves). Forge's early loading window, made before any mod code runs, is turned off for them in run/config/fml.toml.
def fmlConfig = file('run/config/fml.toml')
tasks.matching { it.name in ['runPortCheck', 'runSiteCheck', 'runPlayBench', 'runCreateCheck'] }.configureEach {
    doFirst {
        fmlConfig.parentFile.mkdirs()
        String text = fmlConfig.exists() ? fmlConfig.text : ''
        fmlConfig.text = text =~ /(?m)^earlyWindowControl\s*=/
                ? text.replaceAll(/(?m)^earlyWindowControl\s*=.*$/, 'earlyWindowControl = false')
                : text + 'earlyWindowControl = false\n'
    }
}

// The dev clients run muted (the user's wish: the game is muted unless a run is testing sound): the master volume is set
// to 0 in run/options.txt before each client run; -Psound=on leaves it as it is.
def clientOptions = file('run/options.txt')
def withSound = providers.gradleProperty('sound').isPresent()
tasks.matching { it.name.startsWith('run') && !(it.name in ['runGameTestServer', 'runServer']) }.configureEach {
    doFirst {
        if (!withSound) {
            String text = clientOptions.exists() ? clientOptions.text : ''
            clientOptions.parentFile.mkdirs()
            clientOptions.text = text =~ /(?m)^soundCategory_master:/
                    ? text.replaceAll(/(?m)^soundCategory_master:.*$/, 'soundCategory_master:0.0')
                    : text + (text.isEmpty() || text.endsWith('\n') ? '' : '\n') + 'soundCategory_master:0.0\n'
        }
    }
}

// Forge 1.20.1's test server makes its world as a dedicated server does, from run/server.properties (a normal world
// unless told otherwise, each test then dug into its stone), and keeps it from run to run: so each run starts on a new
// flat world, as the test servers of 1.21 and 26.x do.
def gameTestWorld = file('run/world')
def gameTestProperties = file('run/server.properties')
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        gameTestWorld.deleteDir()
        // (the classic flat ground, as 1.21's test server makes; with no settings 1.20.1 logs an error and makes it anyway)
        gameTestProperties.text = 'level-type=minecraft\\:flat\n' +
                'generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},' +
                '{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains"}\n'
    }
}

// The mixins name the game's methods by their official names; a refmap, made as the code compiles, gives the jar
// their SRG names for players' games.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.legacy.mixins.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.port.mixins.json"
}

// Runtime-only dependencies for dev testing that must not leak into the published metadata.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // MixinExtras (the mod's mixins wrap methods and calls with it): NeoForge carries it, Forge 1.20.1 does not, so this
    // jar does (started by dev.groundburst.legacy.mixin.MixinPlugin).
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixinextras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixinextras_version}"))

    // Main's nullness annotations: compile only, as at run time the missing annotation classes are simply ignored.
    compileOnly "org.jspecify:jspecify:1.0.0"

    // Animated models (missiles, launchers, silo doors, radar dishes, guns, machines). The one hard dependency.
    modImplementation "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"

    // JEI integration (optional at runtime): compile against the API, run the full mod in the dev client.
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"

    // Shader packs on 1.20.1 (optional): Oculus (Iris for Forge, whose API client/fx/IrisFx asks for by name) and
    // Embeddium (Sodium for Forge, which Oculus draws through). -PwithIris loads both into the dev runs.
    if (providers.gradleProperty('withIris').isPresent()) {
        modRuntimeOnly "maven.modrinth:oculus:${oculus_version}"
        modRuntimeOnly "maven.modrinth:embeddium:${embeddium_version}"
    }
    // Create 6 (optional, docs/BACKPORT.md): machines and launchers ride its contraptions. Compiled against its slim jar
    // and its parts (the released jar carries them inside it, in Forge's names, which the dev runs cannot use); never
    // shipped: the code that touches Create runs only when it is installed (dev.groundburst.compat). -PwithCreate loads
    // them into the dev runs (the createCheck run needs them).
    var createParts = ["com.simibubi.create:create-${minecraft_version}:${create_version}:slim",
                       "dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}",
                       "net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}",
                       "com.tterrag.registrate:Registrate:${registrate_version}"]
    createParts.each { part ->
        modCompileOnly(part) { transitive = false }
        if (providers.gradleProperty('withCreate').isPresent()) {
            modRuntimeOnly(part) { transitive = false }
        }
    }
    // Distant Horizons (optional at runtime): -PwithDH runs it in the dev client, its far terrain drawn round the effects.
    if (providers.gradleProperty('withDH').isPresent()) {
        modRuntimeOnly "maven.modrinth:distanthorizons:${dh_version}"
    }
}

// The shader packs the dev runs test with (-PwithIris; -PirisPack=complementary|unbound|bsl|bliss|photon|solas|makeup|off
// picks one, Complementary by default): put in run/shaderpacks, and Oculus's config pointed at the one picked.
configurations {
    shaderPacks {
        canBeConsumed = false
        transitive = false
    }
}
dependencies {
    shaderPacks "maven.modrinth:complementary-reimagined:${complementary_version}@zip"
    shaderPacks "maven.modrinth:bsl-shaders:${bsl_version}@zip"
    shaderPacks "maven.modrinth:bliss-shader:${bliss_version}@zip"
    shaderPacks "maven.modrinth:photon-shader:${photon_version}@zip"
    shaderPacks "maven.modrinth:solas-shader:${solas_version}@zip"
    shaderPacks "maven.modrinth:makeup-ultra-fast-shaders:${makeup_version}@zip"
    shaderPacks "maven.modrinth:complementary-unbound:${unbound_version}@zip"
}
var installShaderPacks = tasks.register('installShaderPacks') {
    group = 'development'
    description = 'Puts the test shader packs in run/shaderpacks and sets Oculus to the one -PirisPack names.'
    var packs = configurations.shaderPacks
    var pick = (project.findProperty('irisPack') ?: 'complementary').toString()
    var runDir = file('run')
    inputs.files(packs)
    outputs.upToDateWhen { false }
    doLast {
        var dir = new File(runDir, 'shaderpacks')
        dir.mkdirs()
        // Each pack's file by the name -PirisPack picks it by.
        var names = ['complementary-reimagined': 'complementary', 'complementary-unbound': 'unbound', 'bsl-shaders': 'bsl',
                     'bliss-shader': 'bliss', 'photon-shader': 'photon', 'solas-shader': 'solas', 'makeup-ultra-fast-shaders': 'makeup']
        String chosen = null
        var wanted = packs.files.collect { f -> var key = names.keySet().find { f.name.startsWith(it) }; key != null ? names[key] + '.zip' : f.name }
        dir.listFiles().findAll { it.name.endsWith('.zip') && !wanted.contains(it.name) }.each { it.delete() }
        packs.files.each { f ->
            var key = names.keySet().find { f.name.startsWith(it) }
            var name = key != null ? names[key] + '.zip' : f.name
            java.nio.file.Files.copy(f.toPath(), new File(dir, name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            if (key != null && names[key] == pick.toLowerCase()) {
                chosen = name
            }
        }
        // Oculus keeps Iris's settings under its own name (and reads Iris's once): both written alike.
        ['oculus.properties', 'iris.properties'].each { fileName ->
            var config = new File(runDir, "config/${fileName}")
            config.parentFile.mkdirs()
            var props = new Properties()
            if (config.exists()) {
                config.withInputStream { props.load(it) }
            }
            props.setProperty('enableShaders', (pick != 'off' && chosen != null).toString())
            if (chosen != null) {
                props.setProperty('shaderPack', chosen)
            }
            config.withOutputStream { props.store(it, 'Set by gradle installShaderPacks') }
        }
        // A mod's load warnings would hold the photographers on Forge's warning screen before the title screen.
        var forge = new File(runDir, 'config/forge-client.toml')
        if (forge.exists()) {
            forge.text = forge.text.replaceAll(/(?m)^(\s*)showLoadWarnings\s*=\s*true/, '$1showLoadWarnings = false')
        } else {
            forge.text = '[client]\n\tshowLoadWarnings = false\n'
        }
        logger.lifecycle("Shader packs in ${dir}; Oculus set to ${pick == 'off' ? 'no pack' : chosen}")
    }
}
if (providers.gradleProperty('withIris').isPresent()) {
    tasks.matching { it.name.startsWith('run') && it.name != 'runGameTestServer' }.configureEach { it.dependsOn installShaderPacks }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            geckolib_version       : geckolib_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Every error at once while porting (javac stops at 100).
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---------------------------------------------------------------------------------------------
// Deployment: every `build` ends with the fresh jar (the one for players, with Forge's names) in a CurseForge test
// instance, the folder `deploy_instance_dir_1_20_1` names (set in your own ~/.gradle/gradle.properties; a Forge 1.20.1
// instance); without one the jar just stays in build/libs.
// ---------------------------------------------------------------------------------------------

abstract class DeployToInstance extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getJarFile()

    @Internal
    abstract DirectoryProperty getModsDir()

    @Input
    abstract Property<String> getModId()

    /** Whether an instance folder was named outright: then a missing one is an error. */
    @Input
    abstract Property<Boolean> getRequired()

    /** Required mods (e.g. GeckoLib) to install if the instance has no copy of them yet. */
    @InputFiles
    abstract ConfigurableFileCollection getDependencyJars()

    @Inject
    abstract FileSystemOperations getFs()

    @TaskAction
    void deploy() {
        File dir = modsDir.isPresent() ? modsDir.get().asFile : null
        if (dir == null || !dir.parentFile.isDirectory()) {
            String where = dir == null ? "(no default folder on this system)" : "${dir.parentFile}"
            if (required.get()) {
                throw new GradleException("CurseForge instance not found at ${where}. " +
                        "Set deploy_instance_dir_1_20_1 in gradle.properties or pass -Pdeploy_instance_dir_1_20_1=<path>.")
            }
            logger.lifecycle("No CurseForge instance at ${where}: the jar was not deployed (set deploy_instance_dir_1_20_1 to deploy it).")
            return
        }
        dir.mkdirs()

        // Remove every previous build of this mod (any version) so only one copy is ever loaded.
        String prefix = modId.get() + '-'
        dir.listFiles()
                .findAll { it.isFile() && it.name.startsWith(prefix) && it.name.endsWith('.jar') }
                .each { old ->
                    if (!old.delete()) {
                        throw new GradleException("Could not delete ${old} - is Minecraft still running from that instance?")
                    }
                    logger.lifecycle("Removed old jar ${old.name}")
                }

        File jar = jarFile.get().asFile
        fs.copy {
            from jar
            into dir
        }
        logger.lifecycle("Deployed ${jar.name} -> ${dir}")

        // Required dependencies: install only when the instance has none, so a copy installed through the
        // CurseForge app (any version) is never duplicated or replaced.
        dependencyJars.files.each { dep ->
            String key = dep.name.toLowerCase(Locale.ROOT).split('-')[0]
            File existing = dir.listFiles().find { it.isFile() && it.name.toLowerCase(Locale.ROOT).startsWith(key) && it.name.endsWith('.jar') }
            if (existing != null) {
                logger.lifecycle("Dependency ${key} already present (${existing.name})")
            } else {
                fs.copy {
                    from dep
                    into dir
                }
                logger.lifecycle("Installed dependency ${dep.name} -> ${dir}")
            }
        }
    }
}

configurations {
    deployDependencies {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    // GeckoLib as released (Forge's names), for the instance.
    deployDependencies "software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}"
}

var instanceDir = providers.gradleProperty('deploy_instance_dir_1_20_1')
        .filter { !it.isBlank() }

var deployToInstance = tasks.register('deployToInstance', DeployToInstance) {
    group = 'deployment'
    description = 'Copies the built mod jar into the 1.20.1 CurseForge test instance (deploy_instance_dir_1_20_1), replacing older builds.'
    // The jar for players: reobfJar's (the game's SRG names), not the dev jar in build/devlibs.
    jarFile = tasks.named('reobfJar').flatMap { it.archiveFile }
    modsDir = layout.dir(instanceDir.map { new File(it, 'mods') })
    modId = project.mod_id
    required = providers.gradleProperty('deploy_instance_dir_1_20_1').map { !it.isBlank() }.orElse(false)
    dependencyJars.from(configurations.deployDependencies)
    outputs.upToDateWhen { false }
}

tasks.named('build') {
    finalizedBy deployToInstance
}
