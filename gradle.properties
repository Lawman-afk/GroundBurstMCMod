# Gradle daemon memory (the Forge decompile and recompile runs in its own process).
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
# The 1.20.1 backport (branch 1.20.1, docs/BACKPORT.md): Minecraft 1.20.1 on Forge 47, ported from the 1.21.1 build
# (branch 1.21.1) every once in a while. Its jar goes to its own test instance (deploy_instance_dir_1_20_1).
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.4.28
# The Forge versions the mod asks for: 47.4 or later (it is built and tested on 47.4.28, never on the older 47 builds,
# so a game on one is told to update rather than left to fail on a hook it may lack).
forge_version_range=[47.4,)

## Dependencies
# GeckoLib (required). For 1.20.1 it is GeckoLib 4 too: Maven group software.bernie.geckolib, artifact geckolib-forge-1.20.1.
geckolib_version=4.8.4
jei_version=15.74.0.234
# MixinExtras, carried in the jar (Forge 1.20.1 has none of its own).
mixinextras_version=0.5.5
# Optional, for the dev runs (Modrinth version ids). Shader packs (-PwithIris): Oculus 1.8.0 and Embeddium 0.3.31 (Iris
# and Sodium for Forge 1.20.1), and the test packs, as the 1.21.1 build's (Complementary Reimagined r5.9.3, BSL 10.1.8...).
oculus_version=iQ1SwGc3
embeddium_version=UTbfe5d1
complementary_version=Bqen1mJX
bsl_version=Y68yiql9
bliss_version=kC2Y8q1P
photon_version=BnGklH5y
solas_version=IsqhVpb8
makeup_version=t4YRxQug
unbound_version=B1kyfoUZ
# Distant Horizons 3.3.3 for 1.20.1 (-PwithDH).
dh_version=6UnEfsRQ
# Create 6.0.8 for 1.20.1 (compiled against always; -PwithCreate loads it into the dev runs): its slim jar from
# Create's maven, and the parts its released jar carries inside it. Build 289 is the released 6.0.8 (the same commit);
# the maven's later 6.0.8 builds are development ones, made against a newer Flywheel than 6.0.8 carries.
create_version=6.0.8-289
flywheel_version=1.0.5
ponder_version=1.0.91
registrate_version=MC1.20-1.3.3

## Mod properties
mod_id=groundburst
mod_name=Ground Burst
mod_license=MIT
mod_version=0.11.1
mod_group_id=dev.groundburst
mod_authors=Lawman-afk
mod_description=Build your own arsenal, from grenades and mines to missiles and the Tsar Bomba, then launch it and watch real craters, mushroom clouds and radioactive fallout reshape the world.

## Deployment
# Folder of the CurseForge instance that every `build` copies the jar into (its mods folder). Set it in your own
# ~/.gradle/gradle.properties (or pass -Pdeploy_instance_dir_1_20_1=...); left blank, the jar just stays in build/libs.
deploy_instance_dir_1_20_1=
