# Gradle daemon memory. NeoForm decompile/recompile runs in its own process, so 2G is plenty here.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
# The 1.21.1 backport (branch 1.21.1, docs/BACKPORT.md): Minecraft 1.21.1 on NeoForge 21.1, brought up to main every
# once in a while. Its jar goes to its own test instance (deploy_instance_dir_1_21_1), never main's 26.3 one.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265

## Dependencies
# GeckoLib (required). For 1.21.1 it is GeckoLib 4: Maven group software.bernie.geckolib, artifact geckolib-neoforge-1.21.1.
geckolib_version=4.9.3
jei_version=19.70.0.469
# Optional, on this branch only (docs/BACKPORT.md): Create 6 (contraptions carry launchers) and Sable (Create
# Aeronautics' ships). Modrinth version ids: Create 6.0.10, Sable 2.0.6, Create Aeronautics 1.3.2.
create_version=UjX6dr61
sable_version=fg9dTRz9
aeronautics_version=44pLdPGg
sable_companion_version=1.6.0
# Optional: Iris (shader packs; the effects use the shaders Iris knows, client/fx/FxRenderTypes). Modrinth version ids:
# Iris 1.8.14-beta.1, Sodium 0.8.13; the dev runs' test packs Complementary Reimagined r5.9.3 and BSL 10.1.8.
iris_version=KduFYu4t
sodium_version=uMOpc5uV
complementary_version=Bqen1mJX
bsl_version=Y68yiql9
bliss_version=kC2Y8q1P
photon_version=BnGklH5y
solas_version=IsqhVpb8
makeup_version=t4YRxQug
unbound_version=B1kyfoUZ
# Distant Horizons for NeoForge 1.21.1 (-PwithDH)
dh_version=9w34y8ai

## Mod properties
mod_id=groundburst
mod_name=Ground Burst
mod_license=MIT
mod_version=0.9.0
mod_group_id=dev.groundburst
mod_authors=Lawman-afk
mod_description=Build your own arsenal, from grenades and mines to missiles and the Tsar Bomba, then launch it and watch real craters, mushroom clouds and radioactive fallout reshape the world.

## Deployment
# Folder of the CurseForge instance that every `build` copies the jar into (its mods folder). Set it in your own
# ~/.gradle/gradle.properties (or pass -Pdeploy_instance_dir=...); left blank, the jar just stays in build/libs.
deploy_instance_dir=
