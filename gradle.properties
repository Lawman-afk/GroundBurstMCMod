# Gradle daemon memory. NeoForm decompile/recompile runs in its own process, so 2G is plenty here.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
# Must match the CurseForge test instance (minecraftinstance.json -> baseModLoader).
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.92

## Dependencies
# GeckoLib (required). Maven group com.geckolib, artifact geckolib-neoforge-<mc version>.
geckolib_version=5.5.7
jei_version=31.15.0.82

## Mod properties
mod_id=groundburst
mod_name=Ground Burst
mod_license=MIT
mod_version=0.3.0
mod_group_id=dev.groundburst
mod_authors=Lawman-afk
mod_description=Build your own arsenal, from grenades and mines to missiles and the Tsar Bomba, then launch it and watch real craters, mushroom clouds and radioactive fallout reshape the world.

## Deployment
# Folder of the CurseForge instance that every `build` copies the jar into (its mods folder). Set it in your own
# ~/.gradle/gradle.properties (or pass -Pdeploy_instance_dir=...); left blank, the jar just stays in build/libs.
deploy_instance_dir=
