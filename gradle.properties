# Gradle daemon memory. NeoForm decompile/recompile runs in its own process, so 2G is plenty here.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
# The 1.21.1 backport (branch 1.21.1, docs/BACKPORT.md): Minecraft 1.21.1 on NeoForge 21.1, brought up to main every
# once in a while. Its jar goes to its own test instance (deploy_instance_dir_1_21_1), never main's 26.3 one.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.265

## Dependencies
# GeckoLib (required). For 1.21.1 it is GeckoLib 4: Maven group software.bernie.geckolib, artifact geckolib-neoforge-1.21.1.
geckolib_version=4.9.3
jei_version=19.70.0.469

## Mod properties
mod_id=groundburst
mod_name=Ground Burst
mod_license=MIT
mod_version=0.7.0
mod_group_id=dev.groundburst
mod_authors=Lawman-afk
mod_description=Build your own arsenal, from grenades and mines to missiles and the Tsar Bomba, then launch it and watch real craters, mushroom clouds and radioactive fallout reshape the world.

## Deployment
# Folder of the CurseForge instance that every `build` copies the jar into (its mods folder). Set it in your own
# ~/.gradle/gradle.properties (or pass -Pdeploy_instance_dir=...); left blank, the jar just stays in build/libs.
deploy_instance_dir=
