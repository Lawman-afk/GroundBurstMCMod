# Gradle daemon memory. NeoForm decompile/recompile runs in its own process, so 2G is plenty here.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
# Must match the CurseForge test instance (minecraftinstance.json -> baseModLoader).
minecraft_version=26.3
minecraft_version_range=[26.3]
neo_version=26.3.0.92

## Dependencies
# GeckoLib (required). Maven group com.geckolib, artifact geckolib-neoforge-<mc version>.
geckolib_version=5.5.7

## Mod properties
mod_id=groundzero
mod_name=Ground Zero
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=dev.groundzero
mod_authors=Lawman-afk
mod_description=Nuclear, special and superweapon arsenal: assembled warheads, ICBMs, launch networks, radar, interceptors, and the Generals-era Particle Cannon, Nuclear Silo and SCUD Storm.

## Deployment
# Folder that `deployToInstance` copies the built jar into. Override with -Pdeploy_instance_dir=... if the instance moves.
# Leave blank to use the CurseForge test instance
deploy_instance_dir=
