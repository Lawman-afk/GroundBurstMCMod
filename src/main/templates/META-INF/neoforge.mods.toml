modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="Sounds made in part from field recordings on Freesound (CC0 and CC BY 4.0); see assets/groundburst/sounds/credits.txt"
description='''
${mod_description}
'''

# Healing (main's DESIGN.md §21.9): blocks burnt by fire, leaves decaying and grass dying next to remembered damage.
[[mixins]]
config="${mod_id}.mixins.json"

# This branch's own (docs/BACKPORT.md): the GameTest helper counting from its structure's corner, as 26.x's does.
[[mixins]]
config="${mod_id}.port.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="geckolib"
    type="required"
    versionRange="[${geckolib_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19,)"
    ordering="NONE"
    side="BOTH"

# Optional: launchers ride Create's contraptions (Create 6) and Sable's sub-levels (Create Aeronautics' ships).
[[dependencies.${mod_id}]]
    modId="create"
    type="optional"
    versionRange="[6.0.0,7)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sable"
    type="optional"
    versionRange="[2.0.0,3)"
    ordering="NONE"
    side="BOTH"
